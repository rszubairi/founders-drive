<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Founders Drive — The Malaysian Startup Ecosystem &amp; Roast My Startup</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --paper: #FBF7F1;
      --ink: #17120E;
      --muted: #6E635A;
      --faint: #9B8E7F;
      --ember: #C6410A;
      --ember-deep: #8A2D0A;
      --gold: #E8A87C;
      --panel: #F2EADE;
      --line: #E2D6C4;
      --line-strong: #D6C7B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #110D0A;
      color: var(--paper);
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Top Global Application Bar */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17, 13, 10, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 32px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--paper);
    }
    .brand-title {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .brand-badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: rgba(198, 65, 10, 0.2);
      color: var(--gold);
      border: 1px solid rgba(198, 65, 10, 0.4);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .nav-tab-btn {
      background: transparent;
      border: none;
      color: #A89B8E;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      padding: 7px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .nav-tab-btn:hover {
      color: #fff;
    }
    .nav-tab-btn.active {
      background: var(--ember);
      color: #fff;
      box-shadow: 0 4px 14px rgba(198, 65, 10, 0.4);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--ember));
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .action-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(198, 65, 10, 0.45);
    }
    .backend-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: #5FBF6A;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5FBF6A;
      box-shadow: 0 0 0 0 rgba(95,191,106,.6);
      animation: pld 2s ease-out infinite;
    }
    @keyframes pld {
      0% { box-shadow: 0 0 0 0 rgba(95,191,106,.5); }
      100% { box-shadow: 0 0 0 8px rgba(95,191,106,0); }
    }

    /* Artboard View Container */
    .view-container {
      width: 100%;
      min-height: calc(100vh - 65px);
      display: flex;
      justify-content: center;
      background: #17120E;
    }
    .view-frame {
      width: 1440px;
      min-height: calc(100vh - 65px);
      border: none;
      background: var(--paper);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- GLOBAL NAV BAR -->
  <header class="top-nav">
    <a href="#" class="brand-logo" onclick="switchView('Main.dc.html', this); return false;">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="12" stroke="var(--gold)" stroke-width="1.8"/>
        <path d="M13 3a10 10 0 0 1 0 20" stroke="var(--ember)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="13" cy="13" r="3.5" fill="var(--ember)"/>
      </svg>
      <span class="brand-title">Founders Drive</span>
      <span class="brand-badge">Malaysia</span>
    </a>

    <nav class="nav-tabs">
      <button class="nav-tab-btn active" onclick="switchView('Main.dc.html', this)">
        <span>Platform Hub</span>
      </button>
      <button class="nav-tab-btn" onclick="switchView('Event.dc.html', this)">
        <span>Flagship: Roast My Startup</span>
      </button>
      <button class="nav-tab-btn" onclick="switchView('Register.dc.html', this)">
        <span>Register Startup</span>
      </button>
      <button class="nav-tab-btn" onclick="switchView('Poll.dc.html', this)">
        <span class="pulse-dot"></span>
        <span>Live Audience Poll</span>
      </button>
    </nav>

    <div class="top-actions">
      <div class="backend-tag">
        <span class="pulse-dot"></span>
        <span>Convex DB Ready</span>
      </div>
      <button class="action-btn-primary" onclick="switchView('Register.dc.html', document.querySelectorAll('.nav-tab-btn')[2])">
        Apply to Pitch &rarr;
      </button>
    </div>
  </header>

  <!-- ARTBOARD FRAME CONTAINER -->
  <main class="view-container">
    <iframe id="app-frame" class="view-frame" src="Main.dc.html" title="Founders Drive Interface"></iframe>
  </main>

  <script>
    function switchView(url, btnElement) {
      const frame = document.getElementById('app-frame');
      frame.src = url;
      
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      if (btnElement) {
        btnElement.classList.add('active');
      }
    }
  </script>
</body>
</html>
